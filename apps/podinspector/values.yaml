image:
  repository: "podinspector"
  tag: "1.0.0"
  pullPolicy: IfNotPresent
overrideNamespace: "monitoring"

service:
  annotations: {}
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  ingressClassName: traefik
  annotations: {}
  tls:
    - hosts:
        - hawer.k8s.eu
      secretName: domain-certificate
  rules:
    - host: hawer.k8s.eu
      name: "{{ .Release.Name }}-service"
      port: 8080
      pathType: Prefix
      path: /

podAnnotations:
  k8s.grafana.com/scrape: 'true'
  k8s.grafana.com/metrics.path: '/metrics'
  k8s.grafana.com/job: "PodInspector"
  k8s.grafana.com/metrics.portNumber: "8080"
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "podinspector"
  vault.hashicorp.com/agent-inject-secret-app.env: "secret/data/podinspector/config"
  vault.hashicorp.com/agent-inject-template-app.env: |
    {{`{{- with secret "secret/data/podinspector/config" -}}`}}
    {{`export TEST1="{{ .Data.data.test1 }}"`}}
    {{`export TEST2="{{ .Data.data.test2 }}"`}}
    {{`{{- end }}`}}

configuration:
  appName: PodInspector
  errorMode:
    exception: 'false'
    hardCrash: 'false'
    softCrash: 'false'
    log: 'false'
    sigkill: 'false'
    failureDelayMaxMinutes: 3600
  profiling:
    enabled: 'true'
    auth:
      enabled: 'true'
      username: admin
      password: admin
    endpoint: http://pyroscope-headless.observability.svc:4040
  tracing:
    enabled: 'true'
    endpoint: k8s-monitoring-alloy-receiver.default.svc:4317

