apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:HawerPL/GitOps-PodInspector.git
    targetRevision: main
    path: clusters/k3s/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
