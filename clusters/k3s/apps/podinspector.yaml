apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinspector
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/HawerPL/PodInspector
    targetRevision: main
    path: charts/PodInspector

    helm:
      releaseName: podinspector
      valueFiles:
        - $values/apps/podinspector/values.yaml

  sources:
    - repoURL: https://github.com/HawerPL/PodInspector
      targetRevision: main
      path: charts/PodInspector

    - repoURL: git@github.com:HawerPL/GitOps-PodInspector.git 
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
